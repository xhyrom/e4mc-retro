[package]
name = "quiclime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.6.18"
env_logger = "0.10.0"
eyre = "0.6.12"
governor = "0.10.0"
idna = "1.0.3"
log = "0.4.19"
parking_lot = "0.12.3"
quinn = "0.11.6"
rand = "0.9.0"
rcgen = "0.14.3"
rustls-pemfile = "2"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.97"
thiserror = "1.0.40"
tokio = { version = "1.28.2", features = ["rt-multi-thread", "fs", "macros", "io-util", "net"] }

[profile.release]
lto = "fat"
debug = "full"
